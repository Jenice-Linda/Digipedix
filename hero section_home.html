.ovw2{position:absolute;inset:0;overflow:hidden;animation:loopb 15000ms infinite;animation-delay:.55s;animation-fill-mode:backwards}
@keyframes loopb{0%,50%{translate:-100% 0;opacity:1;animation-timing-function:cubic-bezier(.25,.46,.45,.94)}60%,84%{translate:0 0;opacity:1;animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{translate:0 0;opacity:0}}
@keyframes loopa{0%,13%{translate:-100% 0;opacity:1;animation-timing-function:cubic-bezier(.25,.46,.45,.94)}23%,84%{translate:0 0;opacity:1;animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{translate:0 0;opacity:0}}
.ovw,.ovw2{-webkit-backdrop-filter:blur(5px) saturate(1.2) brightness(1.03);backdrop-filter:blur(5px) saturate(1.2) brightness(1.03)}
.ov,.ov2{filter:contrast(1.04) brightness(1.03);animation:zoom 22s ease-in-out infinite alternate}
.ovw::after,.ovw2::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 28%,rgba(255,255,255,0) 45%,rgba(255,255,255,.035) 62%,rgba(255,255,255,0) 80%),linear-gradient(180deg,rgba(190,215,255,.04),rgba(190,215,255,0) 40%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset -1px 0 0 rgba(255,255,255,.14),inset 0 0 80px rgba(255,255,255,.025)}
.bar{position:absolute;top:0;bottom:0;right:0;width:4px;background:var(--bone);opacity:0;pointer-events:none;box-shadow:0 0 10px 2px rgba(255,255,255,.55),0 0 30px 8px rgba(255,255,255,.22);animation:barA 15000ms infinite;animation-delay:.55s;animation-fill-mode:backwards}
.ovw2 .bar{animation-name:barB}
@keyframes barB{0%,49.9%{opacity:0}50%,60%{opacity:.7}63%,100%{opacity:0}}
@keyframes barA{0%,12.9%{opacity:0}13%,23%{opacity:.7}26%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bar{display:none}}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.6) 0%,rgba(0,0,0,.4) 60%,rgba(0,0,0,.25) 100%);pointer-events:none}
@media (prefers-reduced-motion:reduce){.bg,.ovw,.ov{animation:none}.ovw2{display:none}}
header{position:absolute;top:calc(2.9rem + env(safe-area-inset-top,0px));left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:.4rem;border-bottom:1px solid rgba(255,255,255,.85);z-index:2}
.brand{display:flex;flex-direction:column;align-items:center;gap:.35rem;margin-left:1.4rem;color:var(--bone);text-decoration:none;font-size:.68rem;font-weight:500}
.brand svg{width:22px;height:22px}
.sub{position:absolute;top:100%;left:0;margin:1.1rem 0 0;font-size:clamp(1rem,1.1vw,1.25rem);font-weight:500;letter-spacing:.01em;color:var(--bone);text-shadow:0 2px 16px rgba(0,0,0,.6)}
.sub{display:grid}
.sub::after{content:"";grid-area:2/1;width:20px;height:3px;margin-top:.55rem;border-radius:999px;background:var(--accent)}
.sub .t{grid-area:1/1;white-space:nowrap}
.t1{animation:t1l 15000ms infinite .55s backwards}
.t2{animation:t2l 15000ms infinite .55s backwards}
.t3{animation:t3l 15000ms infinite .55s backwards}
@keyframes t1l{0%{opacity:0;transform:translateY(10px)}3%,13%{opacity:1;transform:none}16%,100%{opacity:0;transform:translateY(-10px)}}
.sub::after{transform-origin:left center;animation:lnl 15000ms infinite .55s backwards}
@keyframes lnl{0%{opacity:0;transform:scaleX(0)}3%,84%{opacity:1;transform:none}87%,100%{opacity:0;transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.sub::after{animation:none}}
@keyframes t2l{0%,13%{opacity:0;transform:translateY(10px)}16%,50%{opacity:1;transform:none}53%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes t3l{0%,50%{opacity:0;transform:translateY(10px)}53%,84%{opacity:1;transform:none}87%,100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.t1,.t3{display:none}.t2{animation:none}}
.tools{display:flex;align-items:center;gap:1.5rem;margin-top:-.2rem}
.lang{display:flex;align-items:center;gap:.35rem;background:none;border:1px solid var(--bone);border-radius:4px;color:var(--grey);font:500 .62rem "Space Grotesk",sans-serif;padding:.45rem .5rem;cursor:pointer}
.lang svg{width:12px;height:12px}
.signin{color:var(--grey);font-weight:700;font-size:.82rem;text-decoration:none;margin-right:1.1rem}
.signin:hover,.lang:hover{color:var(--hover)}
.copy{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(72rem,90vw);text-align:center;z-index:2}
h1{text-shadow:0 2px 24px rgba(0,0,0,.6);margin:0 0 .9rem;font-size:clamp(1.9rem,2.6vw + .6rem,3.2rem);line-height:1.25;font-weight:700;letter-spacing:-.005em}
p{margin:0 auto;max-width:68rem;font-size:clamp(.95rem,.7vw + .5rem,1.15rem);line-height:1.4;color:#e4e4e4}
h1 .ln{display:block}
nav{position:fixed;right:var(--pad);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1.05rem;z-index:3}
nav a{display:flex;align-items:center;justify-content:flex-end;gap:.85rem;color:var(--grey);text-decoration:none;font-size:.8rem;transition:color .3s,transform .2s}
nav a::after{content:"";width:1.55rem;height:1px;border-radius:999px;background:var(--bone);transition:width .45s cubic-bezier(.2,.85,.2,1),height .25s,background .3s,box-shadow .3s}
nav a.on{color:var(--accent)}
nav a.on::after{width:2.2rem;height:3px;background:var(--accent)}
nav a:hover,nav a:focus-visible{color:var(--hover)}
nav a:hover::after,nav a:focus-visible::after{width:2.8rem;height:2px;background:var(--hover);box-shadow:0 0 10px rgba(255,74,28,.65)}
nav a.on:hover::after,nav a.on:focus-visible::after{height:3px}
nav a:active{transform:scale(.96);transform-origin:right center}
.copy .ln,.copy p{animation:rise 1.1s cubic-bezier(.2,.85,.2,1) both}
.copy .ln:nth-child(1){animation-delay:.25s}
.copy .ln:nth-child(2){animation-delay:.42s}
.copy p{animation-delay:.65s}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.copy .ln,.copy p{animation:none}}
@media (prefers-reduced-motion:reduce){nav a,nav a::after{transition:none}}
a:focus-visible,button:focus-visible{outline:3px solid var(--bone);outline-offset:3px}
@media (max-width:700px){header{top:calc(1.5rem + env(safe-area-inset-top,0px))}.brand{margin-left:0}nav{top:auto;bottom:calc(4.5rem + env(safe-area-inset-bottom,0px));right:auto;left:var(--pad);transform:none;flex-direction:row;flex-wrap:wrap;gap:.5rem 1.25rem}nav a{flex-direction:column;align-items:flex-start;gap:.35rem}nav a::after{width:1.2rem}.signin{margin-right:0}}
</style>
</head>
<body>
<main class="hero" id="hero">
  <div id="layers" aria-hidden="true"><div class="bg"></div><div class="ovw"><div class="ov"></div><div class="bar" aria-hidden="true"></div></div><div class="ovw2"><div class="ov2"></div><div class="bar" aria-hidden="true"></div></div></div>
  <div class="scrim"></div>
  <header>
    <a class="brand" href="" aria-label="Northlight home">
      <img src="assets/logo.png" alt="Digipedix" style="display: block; width: 30px; height: 42px; object-fit: contain">
    </a>
    <div class="tools">
      <button class="lang" type="button" aria-label="Language: English"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>EN<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true" style="width:8px;height:8px"><path d="M6 9l6 6 6-6"/></svg></button>
      <a class="signin" href="#signin">Sign in</a>
    </div>
    <h2 class="sub"><span class="t t1" aria-hidden="true">Fully anonymized case</span><span class="t t2" aria-hidden="true">Segmentation</span><span class="t t3" aria-hidden="true">Landmarks & measurements</span></h2>
  </header>
  <div class="copy">
      <h1><span class="ln">Where Planning,<br></span><span class="ln">Demonstration and Learning Connect</span></h1>
      <p>One digital platform exploring orthpedic planning,<br>creating engaging demonstrations and exchange knowledge.</p>
  </div>
  <nav id="nav"><a class="on" href="#Home">Home</a><a href="#Modules">Modules</a><a href="#How it works">How it works</a><a href="#Contact">Contact</a></nav>
</main>
<script>
document.querySelector('.brand').addEventListener('click',function(e){e.preventDefault();var home=location.href.split(/[?#]/)[0];if(location.href===home){location.reload()}else{location.assign(home)}});
Array.prototype.forEach.call(document.querySelectorAll('#nav a'),function(a){a.addEventListener('click',function(e){e.preventDefault();document.querySelectorAll('#nav a').forEach(function(x){x.classList.remove('on')});a.classList.add('on')})});
</script>
</body>
</html>

</body></html>
